name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Lint Frontend (Next.js)
  # ─────────────────────────────────────────────
  lint-frontend:
    name: Frontend – Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Prototype/frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Prototype/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  # ─────────────────────────────────────────────
  # Job 2: Lint & Unit Test Backend (NestJS)
  # ─────────────────────────────────────────────
  test-backend:
    name: Backend – Lint & Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Prototype/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Prototype/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test -- --passWithNoTests --forceExit
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_SECRET: ci-secret-for-testing
          NODE_ENV: test

