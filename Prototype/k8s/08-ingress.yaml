apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tradeup-ingress
  namespace: tradeup
  annotations:
    kubernetes.io/ingress.class: "gce" # Google Cloud Load Balancer
    # Add managed certificate annotations for HTTPS in production
    # networking.gke.io/managed-certificates: "tradeup-cert"
spec:
  rules:
    - http:
        paths:
          # Route frontend traffic
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: tradeup-frontend-svc
                port:
                  number: 80
          # Route REST API traffic
          - pathType: Prefix
            path: "/api"
            backend:
              service:
                name: tradeup-backend-svc
                port:
                  number: 80
          # Route WebSocket traffic
          - pathType: Prefix
            path: "/socket.io"
            backend:
              service:
                name: tradeup-backend-svc
                port:
                  number: 80
